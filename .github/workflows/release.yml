name: Release

# Creates a GitHub release (and tag) automatically whenever the version in
# custom_components/quint/manifest.json changes on main. HACS watches releases,
# and Quint installs them and restarts Home Assistant by itself.
on:
  push:
    branches: [main]
    paths:
      - custom_components/quint/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          echo "version=$(python3 -c "import json;print(json.load(open('custom_components/quint/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Create release when it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --title "Quint ${{ steps.v.outputs.version }}" --generate-notes --target "$GITHUB_SHA" --latest
          fi
